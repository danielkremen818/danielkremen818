name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Platane/snk v3.5.0 - svg-only variant (skips gif encoding)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#5b21b6
            dist/github-snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#4c1d95,#6d28d9,#8b5cf6,#a78bfa

      # crazy-max/ghaction-github-pages v5.0.0
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
